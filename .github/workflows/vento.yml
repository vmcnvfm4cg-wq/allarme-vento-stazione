name: Allarme vento VEVOR

on:

  schedule:

    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:

  vento:

    runs-on: ubuntu-latest

    steps:

      - name: Scarica repository

        uses: actions/checkout@v4

      - name: Configura Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"

      - name: Installa requests

        run: |

          pip install requests

      - name: Ripristina stato

        uses: actions/cache/restore@v4

        with:

          path: stato.json

          key: vento-stato-${{ github.run_id }}

          restore-keys: |

            vento-stato-

      - name: Esegui vento.py

        env:

          WU_API_KEY: ${{ secrets.WU_API_KEY }}

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

        run: |

          python vento.py

      - name: Salva stato

        uses: actions/cache/save@v4

        with:

          path: stato.json

          key: vento-stato-${{ github.run_id }}
